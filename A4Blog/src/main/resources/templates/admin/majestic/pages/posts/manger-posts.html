<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/majestic/layout}" xmlns="http://www.w3.org/1999/html">
<body>
<section layout:fragment="main">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.23.2/dist/bootstrap-table.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.23.2/dist/bootstrap-table.min.js"></script>

    <div class="content-wrapper">
        <div class="page-header">
            <h3 class="page-title"> 页面管理 </h3>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#">Pages</a></li>
                    <li class="breadcrumb-item active" aria-current="page">页面管理</li>
                </ol>
            </nav>
        </div>

        <div class="row">
            <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Hoverable Table</h4>
                        <div class="toolbar">
                            <button type="button" class="btn btn-primary" onclick="showEditDialog()"> 新建
                            </button>
                        </div>
                        <table class="table table-bordered text-center"
                               id="table"
                               data-toggle="table"
                               data-pagination-parts=["pageSize","pageList"]
                               data-method="post"
                               data-toolbar="#toolbar"
                               data-url="/admin/posts"
                               data-side-pagination="server"
                               data-response-handler="responseHandler"
                               data-resizable="true"
                               data-pagination="true">
                            <thead>
                            <tr class="text-center">
                                <th data-formatter="detailFormatter">#</th>
                                <th data-field="postId">文章Id</th>
                                <th data-field="title" data-formatter="titleFormatter">文章标题</th>
                                <th data-field="mdId">MD Id</th>
                                <th data-formatter="statusFormatter">状态</th>
                                <th data-formatter="categoryFormatter">分类</th>
                                <th data-formatter="tagFormatter">标签</th>
                                <th data-field="updateTime">修改时间</th>
                                <th data-field="createTime">创建时间</th>
                                <th data-formatter="operateFormatter">操作</th>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal fade " data-bs-backdrop="static" tabindex="-1"
         aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="card">
                    <div class="card-body p-1 ">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">新建文章</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="put-page-form" class="forms-sample" action="/admin/put-page" method="post">
                                <div class="form-group">
                                    <label for="pageName">文章标题</label>
                                    <input type="text" class="form-control" id="pageName" name="pageName"
                                           placeholder="文章标题">
                                </div>
                                <div class="form-group">
                                    <label for="mdId">Markdown ID</label>
                                    <div class="input-group d-flex align-items-center">
                                        <input type="text" class="form-control" id="mdId" name="mdId"
                                               placeholder="Markdown ID" aria-describedby="button-addon2">
                                        <div class="input-group-append ms-2">
                                            <button class="btn btn-sm btn-primary" type="button" onclick="searchMdId()">
                                                查找
                                            </button>
                                        </div>
                                    </div>

                                </div>
                                <div class="form-group">
                                    <label for="category">文章分类</label>
                                    <select class="form-select" id="category">
                                        <option>Male</option>
                                        <option>Female</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="tags">文章标签</label>
                                    <select class="form-select" id="tags">
                                        <option>Male</option>
                                        <option>Female</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button id="put-page" type="button" class="btn btn-primary">Save changes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="searchMdPage" class="modal fade " data-bs-backdrop="static" tabindex="-1"
         aria-labelledby="exampleModalLabel1" aria-hidden="true">
        <div class="modal-dialog .modal-fullscreen-xl-down modal-dialog-centered ">
            <div class="modal-content">
                <div class="card">
                    <div class="card-body p-1 ">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel1" >查找md</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="table-responsive">
                                <table class="table table-bordered text-center"
                                       id="mdTable"
                                       data-toggle="mdTable"
                                       data-pagination-parts=["pageSize","pageList"]
                                       data-method="post"
                                       data-url="/admin/mds"
                                       data-side-pagination="server"
                                       data-response-handler="responseHandler"
                                       data-resizable="true"
                                       data-pagination="true">
                                    <thead>
                                    <tr class="text-center">
                                        <th data-formatter="detailFormatter" >#</th>
                                        <th data-field="mdId" >MD Id</th>
                                        <th data-field="title" >标题</th>
                                        <th data-field="content" data-formatter="contentFormatter">内容</th>
                                        <th data-field="createTime">创建时间</th>
                                    </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                        <div class="modal-footer">
<!--                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>-->
                            <button id="put-page" type="button" class="btn btn-primary">确认</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        var myModal = new bootstrap.Modal(document.getElementById('myModal'))
        var searchMdPage = new bootstrap.Modal(document.getElementById('searchMdPage'))

        function showEditDialog() {
            myModal.show()
        }

        function searchMdId() {
            searchMdPage.show()
            $('#mdTable').bootstrapTable()
        }

        function categoryFormatter(value, row, index) {
            if (row['category'] == null) {
                return;
            }
            return '<label class="badge rounded-pill text-bg-dark">' + row['category'].name + '</label>'
        }

        function tagFormatter(value, row, index) {
            if (row.tags.length === 0) {
                return;
            }
            let lab = "";
            for (const tagsKey of row.tags) {
                lab += '<label class="badge rounded-pill text-bg-secondary">' + tagsKey.name + '</label>';
            }
            return lab
        }

        function statusFormatter(value, row, index) {
            return row['enable'] ? '<label class="badge badge-warning">已发布</label>' : '<label class="badge badge-info">未发布</label>'
        }

        function titleFormatter(value, row, index) {
            return '<a target="_blank" href="/admin/preview-post/' + row['postId'] + '" >' + value + '</a>'
        }

        function detailFormatter(value, row, index) {
            return index + 1
        }

        function contentFormatter(value, row, index) {
            return value.substring(0, 20) + "..."
        }

        function operateFormatter(value, row, index) {
            return [
                '<button type="button" class="btn btn-dark btn-icon-text" onclick="onEdit(\'' + row['mdId'] + '\')">编辑',
                '<i class="mdi mdi-file-check btn-icon-append"></i>',
                '</button>      ',
                '<button type="button" class="btn btn-warning btn-icon-text">删除',
                '<i class="mdi mdi-delete-forever btn-icon-append"></i>',
                '</button>'
            ].join('')
        }

        function responseHandler(res) {
            let row = {}
            if (res.isOk) {
                row['total'] = res.data.total
                row['rows'] = res.data.records
                return row
            } else {
                return row
            }
        }

        $("#put").click(function () {

            $("#md_form").ajaxSubmit(function (data) {
                // alert(data.Message);
                if (data.code !== 200) {
                    Swal.fire(data.msg);
                } else {
                    // $.cookie("Authorization", "bearer "+data.data.access_token)
                    // $.cookie("refresh_token", data.data.refresh_token)
                    Swal.fire(data.msg);
                }
                console.log(data)
            });
        });
    </script>
</section>
</body>
</html>
